[tools]
aws-cli = "2.40.3"
aws-sam = "1.172.1"
# Runs the Docusaurus journal in journal/.
node = "26.13.1"
# Needed by `sam build` (BuildMethod: makefile); not installed system-wide.
"conda:make" = "4.4.1"
# 3.14, not 3.15: must match an available AWS Lambda Python runtime.
python = "3.14.10"
uv = "0.13.8"

[settings]
# Let mise activate the uv-managed .venv when present.
python.uv_venv_auto = true
