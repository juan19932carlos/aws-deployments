# Node packages only. Python apps live in the uv workspace (pyproject.toml).
packages:
  - architecture/site

# One version per dependency. Packages write "catalog:" instead of a range.
catalog:
  "@docusaurus/core": 3.10.2
  "@docusaurus/module-type-aliases": 3.10.2
  "@docusaurus/plugin-content-docs": 3.10.2
  "@docusaurus/preset-classic": 3.10.2
  "@docusaurus/theme-mermaid": 3.10.2
  "@docusaurus/tsconfig": 3.10.2
  "@docusaurus/types": 3.10.2
  # theme-mermaid 3.10.2 accepts only ^0.1.9.
  "@mermaid-js/layout-elk": 0.1.9
  "@types/react": 19.3.0
  react: 19.3.1
  react-dom: 19.3.1
  typescript: 6.0.3

# Install scripts are blocked by default. core-js only prints a funding message.
allowBuilds:
  core-js: false
